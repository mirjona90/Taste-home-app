<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f3028">
<title>Taste Home Pro</title>
<style>
:root{--brand:#8f3028;--green:#198557;--orange:#e29217;--red:#c62828;--bg:#f7f0e7;--card:#fff;--muted:#7a716a;--line:#eadfd5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:#201c19}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:14px 18px 12px;box-shadow:0 2px 8px #0002}
.head{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:25px;font-weight:900;line-height:1.05}.subtitle{opacity:.85;margin-top:4px}.datebox{display:flex;align-items:center;gap:5px;background:#ffffff12;border:1px solid #ffffff22;border-radius:16px;padding:5px}.datebox input{width:150px;background:transparent;color:#fff;border:0}.datebox input::-webkit-calendar-picker-indicator{filter:invert(1)}.datebtn{background:#ffffff15;color:#fff;padding:10px 12px}
nav{position:sticky;top:81px;z-index:19;background:var(--bg);display:flex;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line)}
button,input,textarea,select{font:inherit}button{border:0;border-radius:13px;padding:12px;font-weight:800;cursor:pointer}.navbtn{flex:1;background:#eee5dc}.navbtn.active{background:#fff;box-shadow:0 2px 8px #0001;color:var(--brand)}
main{max-width:820px;margin:auto;padding:12px 14px 32px}.hidden{display:none!important}.card{background:#fff;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 4px 15px #0000000c}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.table{position:relative;text-align:left;background:#fff;border:2px solid transparent;border-radius:18px;padding:15px;min-height:116px;box-shadow:0 3px 12px #0001}.table.active{border-color:#87c9ad}.table.alert{border-color:var(--red);background:#fff8f7}.table h3{margin:0 0 5px;font-size:17px}.amount{font-size:22px;color:var(--green);font-weight:900}.sub,.meta{font-size:13px;color:var(--muted)}.redtxt{color:var(--red);font-weight:900}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{background:#eee5dc}.total{font-size:23px;font-weight:900;color:var(--green)}
label{display:block;color:var(--muted);font-size:13px;margin:8px 0 4px}input,textarea,select{width:100%;border:1px solid #d9cec4;border-radius:12px;padding:10px;background:#fff}.compact-fields{display:grid;grid-template-columns:1.4fr .6fr;gap:8px}.notes{min-height:52px;height:52px;resize:vertical}
.people{text-align:center;font-size:20px;font-weight:900;color:var(--brand);margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.name{font-weight:900}.price{font-size:13px;color:var(--muted)}.counter{display:flex;align-items:center;gap:10px}.counter b{min-width:26px;text-align:center;font-size:20px}.minus,.plus{width:46px;height:46px;padding:0;font-size:25px}.minus{background:#eee}.plus{background:var(--brand);color:#fff}
.status-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.status-btn{background:#eee;padding:12px 5px;font-size:12px;min-height:66px}.status-btn.selected{background:var(--brand);color:#fff}.next{width:100%;background:var(--orange);color:#fff;margin-top:10px;font-size:18px}
.request-grid,.paybuttons,.actions,.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.request-btn,.paybtn{background:#eee}.request-btn.selected{background:var(--orange);color:#fff}.paybtn.selected{background:var(--green);color:#fff}
.drinktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drinktile{position:relative;background:#fff;border:1px solid #ded4ca;border-radius:18px;padding:15px 8px;text-align:center;min-height:130px}.drinktile .ico{font-size:37px}.drinktile .dn{font-size:18px;font-weight:900}.drinktile .dp{color:var(--muted);font-weight:700}.badgealert{position:absolute;right:8px;top:8px;background:var(--red);color:#fff;border-radius:999px;min-width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;box-shadow:0 2px 5px #0003}
.drinkdetail{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}.drinkhead{display:flex;justify-content:space-between;align-items:center}.delivery{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin:12px 0}.delivery b{display:block;font-size:22px}.deliverBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.delivered{background:#e8e8e8}.delivered:not(:disabled){background:var(--orange);color:#fff}.delivered:disabled{color:#aaa}
.share{background:#25D366}.print{background:#34495e;color:#fff}.close{background:var(--green);color:#fff}.delete{background:#f4d7d4;color:var(--red)}.kitchen{background:var(--orange);color:#fff}.invoice{background:#e8ded4}
.livebox{background:#fff;border-radius:18px;padding:14px;margin:10px 0}.livegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.livegrid b{display:block;font-size:21px;color:var(--green)}
.kitchen-card{border-left:6px solid var(--green)}.kitchen-card.waiting{border-left-color:var(--red)}.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:12px;margin:3px}
.invoice-line{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.empty{text-align:center;color:var(--muted);padding:26px}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;border-radius:15px;padding:12px;box-shadow:0 2px 9px #0001}.stat b{display:block;font-size:21px;color:var(--green)}
.chart{display:flex;align-items:flex-end;gap:4px;height:210px;padding-top:12px;overflow-x:auto}.barwrap{min-width:25px;flex:1;text-align:center;font-size:9px}.bar{background:var(--brand);min-height:2px;border-radius:5px 5px 0 0}.barval{font-size:8px;white-space:nowrap;margin-bottom:4px}
.addtable{width:100%;background:#eee5dc;color:var(--brand);margin-top:10px}.tipbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paidcheck{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:800}.paidcheck input{width:22px;height:22px}
#printArea{display:none}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:420px){.title{font-size:21px}.datebox input{width:122px}.status-btn{font-size:11px}.compact-fields{grid-template-columns:1fr 100px}}
@media print{body *{visibility:hidden!important}#printArea,#printArea *{visibility:visible!important}#printArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:20px;background:#fff}}
</style>
</head>
<body>
<header><div class="head"><div><div class="title">Taste Home<br>Pro</div><div class="subtitle">Shërbimi i mbrëmjes</div></div><div class="datebox"><button class="datebtn" onclick="moveDate(-1)">‹</button><input id="workDate" type="date" onchange="saveWorkDate()"><button class="datebtn" onclick="today()">Sot</button><button class="datebtn" onclick="moveDate(1)">›</button></div></div></header>
<nav><button id="tabTables" class="navbtn active" onclick="showTables()">🪑 Tavolinat</button><button id="tabKitchen" class="navbtn" onclick="showKitchen()">🍽️ Shërbimi</button><button id="tabHistory" class="navbtn" onclick="showHistory()">🧾 Historia</button><button id="tabStats" class="navbtn" onclick="showStats()">📊 Statistika</button></nav>
<main>
<section id="tablesView">
<div id="liveRevenue" class="livebox"></div><div id="tables" class="grid"></div>
<button id="addTableBtn" class="addtable" onclick="addExtraTable()">＋ Shto tavolinë tjetër</button>
</section>
<section id="tableView" class="hidden">
<div class="topline"><button class="back" onclick="showTables()">←</button><h3 id="tableHeader" style="margin:0"></h3><div id="topTotal" class="total"></div></div>
<div class="card">
<div class="compact-fields"><div><label>Emri i rezervimit / klientit</label><input id="tableName" placeholder="p.sh. Ella Wise" oninput="updateDetails()"></div><div><label>Persona rezervim</label><input id="reservedPeople" type="number" min="0" placeholder="3" oninput="updateDetails()"></div></div>
<div id="autoPeople" class="people">👥 0 persona</div>
<label>Shënime</label><textarea id="notes" class="notes" placeholder="p.sh. pa alkool..." oninput="updateDetails()"></textarea>
</div>
<div class="card"><div class="topline"><h3>👥 Menu</h3><span class="meta">Personat korrigjohen vetë</span></div><div id="menus"></div></div>
<div class="card"><h3>🍽️ Ku jemi me shërbimin?</h3><div id="statusButtons" class="status-grid"></div><button class="next" onclick="nextStage()">HAPI TJETËR →</button></div>
<div class="card"><h3>⚡ Kërkesa të shpejta</h3><div id="requestButtons" class="request-grid"></div></div>
<div class="card"><div class="topline"><h3>🥂 Pijet</h3><span class="meta">Kliko katrorin për +1</span></div><div id="drinkTiles" class="drinktiles"></div><div id="drinkDetails"></div></div>
<div class="card"><div class="topline"><h3>💳 Pagesa</h3><div id="tableTotal" class="total"></div></div><div class="paybuttons"><button id="cashBtn" class="paybtn" onclick="setPayment('Cash')">💵 CASH</button><button id="cardBtn" class="paybtn" onclick="setPayment('Card')">💳 CARD</button></div><div id="cardBox" class="hidden"><label class="paidcheck"><input id="cardPaid" type="checkbox" onchange="setCardPaid()"> Karta është paguar</label><label>Shënim Card</label><input id="cardNote" placeholder="p.sh. Visa / 2 pagesa" oninput="updateDetails()"></div><div class="tipbox"><div><label>Shuma e marrë €</label><input id="received" type="number" step=".01" min="0" placeholder="0" oninput="updateReceived()"></div><div><label>Bakshishi</label><div id="tip" class="total" style="padding-top:7px">€0.00</div></div></div></div>
<div class="card"><div class="actions"><button class="kitchen" onclick="sendKitchenUpdate()">👨‍🍳 Update Kuzhina</button><button class="print" onclick="printCurrent()">🖨️ Printo</button><button class="invoice" onclick="shareCurrent()">🧾 Dërgo faturën</button><button class="delete" onclick="clearCurrent()">🗑️ Fshije</button><button class="close" style="grid-column:1/-1" onclick="closeCurrent()">✅ Mbyll tavolinën</button></div></div>
</section>
<section id="kitchenView" class="hidden"><div id="kitchenList"></div></section>
<section id="historyView" class="hidden"><div class="card"><label>Data</label><input id="historyDate" type="date" onchange="drawHistory()"></div><div class="toolbar"><button class="share" onclick="shareDaily()">Share xhiron</button><button class="delete" onclick="clearHistoryForDate()">Fshij datën</button></div><div id="dailyTotal" class="card total"></div><div id="historyBox"></div></section>
<section id="statsView" class="hidden"><div class="card"><div class="status-grid" style="grid-template-columns:repeat(3,1fr)"><button id="statsAnnualBtn" class="status-btn selected" onclick="setStatsMode('year')">Vjetore</button><button id="statsMonthlyBtn" class="status-btn" onclick="setStatsMode('month')">Mujore</button><button id="statsWeeklyBtn" class="status-btn" onclick="setStatsMode('week')">Javore</button></div><div id="statsYearBox"><label>Viti</label><select id="statsYear" onchange="drawStats()"></select></div><div id="statsMonthBox" class="hidden"><label>Muaji</label><input id="statsMonth" type="month" onchange="drawStats()"></div><div id="statsWeekBox" class="hidden"><label>Java</label><input id="statsWeek" type="week" onchange="drawStats()"></div><div id="statsPeriodLabel" class="meta" style="margin-top:10px"></div></div><div id="statsCards" class="statsgrid"></div><div class="card"><h3>Persona</h3><div id="peopleChart" class="chart"></div></div><div class="card"><h3>Xhiro</h3><div id="revenueChart" class="chart"></div></div><div class="card"><h3>Bakshishe</h3><div id="tipsChart" class="chart"></div></div></section>
<div id="printArea"></div>
</main>
<script>
const ITEMS=[
{k:"normal",n:"Menu Normale",p:25,type:"menu"},{k:"veg",n:"Menu Vegjet",p:25,type:"menu"},{k:"kids",n:"Menu Kids",p:15,type:"menu"},{k:"group",n:"Grup",p:15,type:"menu"},
{k:"beer",n:"Birrë",p:3.5,type:"drink",ico:"🍺"},{k:"red",n:"Verë e kuqe",p:2.5,type:"drink",ico:"🍷"},{k:"white",n:"Verë e bardhë",p:2.5,type:"drink",ico:"🥂"},{k:"juice",n:"Grape Juice",p:2.5,type:"drink",ico:"🍇"}];
const STAGES=[{short:"1<br>Aper. 1",msg:"APERITIV 1"},{short:"2<br>Aper. 2",msg:"APERITIV 2"},{short:"3<br>Supë",msg:"SUPA"},{short:"4<br>Main",msg:"MAIN"},{short:"5<br>Ëmb.",msg:"ËMBËLSIRA"}];
const REQUESTS=["💧 Ujë","🍞 Bukë"];
const POSITIONS=["🍲 Tek Tepsiat","🍇 Tek Hardhia","🚰 Tek Cezma","💡 Tek Drita","🍊 Tek Mandarina","🟠 Tek Portokalli","🌳 Nën Fik","🌿 Në Bahçe","🚪 Tek Dera","➕ Tavolinë Extra"];
const MAX_TABLES=13;
const DB_KEY="taste_home_tables_v11",HIST_KEY="taste_home_history_v11",DATE_KEY="taste_home_workdate_v11",COUNT_KEY="taste_home_tablecount_v11";
let db=JSON.parse(localStorage.getItem(DB_KEY)||"{}"),history=JSON.parse(localStorage.getItem(HIST_KEY)||"[]"),tableCount=Number(localStorage.getItem(COUNT_KEY)||10),current=1;
const $=id=>document.getElementById(id);
function blank(t){let q={},sent={},served={};ITEMS.forEach(i=>q[i.k]=sent[i.k]=served[i.k]=0);return{q,sent,served,name:"",reservedPeople:0,notes:"",updated:null,stage:0,requests:{},payment:"Cash",cardPaid:false,cardNote:"",received:0,position:POSITIONS[t-1]||("➕ Tavolinë "+t)}}
function normalize(t){if(!db[t])db[t]=blank(t);let b=db[t];b.q=b.q||{};b.sent=b.sent||{};b.served=b.served||{};ITEMS.forEach(i=>{if(b.q[i.k]==null)b.q[i.k]=0;if(b.sent[i.k]==null)b.sent[i.k]=0;if(b.served[i.k]==null)b.served[i.k]=0});if(b.q.menu!=null&&b.q.normal==null)b.q.normal=b.q.menu||0;if(!b.position)b.position=POSITIONS[t-1]||("➕ Tavolinë "+t);if(b.reservedPeople==null)b.reservedPeople=b.persons||0;if(b.cardPaid==null)b.cardPaid=false;if(b.received==null)b.received=0;if(!b.payment)b.payment="Cash";if(!b.requests)b.requests={};if(typeof b.stage!=="number")b.stage=0}
for(let t=1;t<=MAX_TABLES;t++)normalize(t);
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));localStorage.setItem(HIST_KEY,JSON.stringify(history));localStorage.setItem(COUNT_KEY,String(tableCount))}
function money(v){return "€"+Number(v||0).toFixed(2)}function stamp(){return new Date().toLocaleString("sq-AL")}
function total(t){return ITEMS.reduce((s,i)=>s+(Number(db[t].q[i.k])||0)*i.p,0)}
function menuPeople(t){return ["normal","veg","kids","group"].reduce((s,k)=>s+(Number(db[t].q[k])||0),0)}
function people(t){return menuPeople(t)||Number(db[t].reservedPeople)||0}
function tipAmount(t){return Math.max(0,(Number(db[t].received)||0)-total(t))}
function pending(t,k){return Math.max(0,(db[t].q[k]||0)-(db[t].served[k]||0))}
function pendingCount(t){return ITEMS.filter(i=>i.type==="drink").reduce((s,i)=>s+pending(t,i.k),0)}
function hasRequests(t){return Object.values(db[t].requests||{}).some(Boolean)}
function isoDate(){return $("workDate").value||new Date().toISOString().slice(0,10)}
$("workDate").value=localStorage.getItem(DATE_KEY)||new Date().toISOString().slice(0,10);$("historyDate").value=$("workDate").value;
function saveWorkDate(){localStorage.setItem(DATE_KEY,$("workDate").value);$("historyDate").value=$("workDate").value;drawTables()}
function today(){$("workDate").value=new Date().toISOString().slice(0,10);saveWorkDate()}
function moveDate(n){let d=new Date($("workDate").value+"T12:00:00");d.setDate(d.getDate()+n);$("workDate").value=d.toISOString().slice(0,10);saveWorkDate()}
function hideAll(){document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));["tabTables","tabKitchen","tabHistory","tabStats"].forEach(x=>$(x).classList.remove("active"))}
function showTables(){hideAll();$("tablesView").classList.remove("hidden");$("tabTables").classList.add("active");drawTables()}
function showKitchen(){hideAll();$("kitchenView").classList.remove("hidden");$("tabKitchen").classList.add("active");drawKitchen()}
function showHistory(){hideAll();$("historyView").classList.remove("hidden");$("tabHistory").classList.add("active");$("historyDate").value=$("workDate").value;drawHistory()}
function showStats(){hideAll();$("statsView").classList.remove("hidden");$("tabStats").classList.add("active");fillYears();drawStats()}
function activeTotals(){let revenue=0,tips=0,unpaid=0;for(let t=1;t<=tableCount;t++){revenue+=total(t);tips+=tipAmount(t);if(db[t].payment==="Card"&&!db[t].cardPaid)unpaid+=total(t)}return{revenue,tips,unpaid}}
function drawTables(){let a=activeTotals();$("liveRevenue").innerHTML=`<div class="livegrid"><div>Xhiro aktive<b>${money(a.revenue)}</b></div><div>Bakshish<b>${money(a.tips)}</b></div><div>Card pa paguar<b class="${a.unpaid?'redtxt':''}">${money(a.unpaid)}</b></div></div>`;$("tables").innerHTML="";
for(let t=1;t<=tableCount;t++){let p=pendingCount(t),el=document.createElement("button");el.className="table "+(p?"alert":total(t)>0?"active":"");let display=db[t].name||"Pa emër";el.innerHTML=`<h3>${db[t].position}</h3><div class="sub">${display} · 👥 ${people(t)}</div><div class="amount">${money(total(t))}</div>${p?`<div class="redtxt">🔴 ${p} pije për t'u çuar</div>`:""}${db[t].payment==="Card"&&!db[t].cardPaid&&total(t)>0?`<div class="redtxt">💳 Pa paguar</div>`:""}`;el.onclick=()=>openTable(t);$("tables").appendChild(el)}
$("addTableBtn").classList.toggle("hidden",tableCount>=MAX_TABLES)}
function addExtraTable(){if(tableCount>=MAX_TABLES)return;tableCount++;normalize(tableCount);db[tableCount].position="➕ Tavolinë Shtesë "+(tableCount-10);save();drawTables()}
function openTable(t){current=t;hideAll();$("tableView").classList.remove("hidden");$("tableName").value=db[t].name||"";$("reservedPeople").value=db[t].reservedPeople||"";$("notes").value=db[t].notes||"";$("cardNote").value=db[t].cardNote||"";$("received").value=db[t].received||"";drawCurrent()}
function updateDetails(){let b=db[current];b.name=$("tableName").value.trim();b.reservedPeople=Math.max(0,Number($("reservedPeople").value)||0);b.notes=$("notes").value.trim();b.cardNote=$("cardNote").value.trim();b.updated=stamp();save();drawHeaderOnly()}
function drawHeaderOnly(){$("tableHeader").textContent=db[current].position+" · "+(db[current].name||"Pa emër");$("topTotal").textContent=money(total(current));$("autoPeople").textContent=`👥 ${people(current)} persona`}
function setPayment(p){db[current].payment=p;if(p==="Cash")db[current].cardPaid=true;else if(p==="Card"&&db[current].cardPaid==null)db[current].cardPaid=false;save();drawPayment()}
function setCardPaid(){db[current].cardPaid=$("cardPaid").checked;save()}
function updateReceived(){db[current].received=Math.max(0,Number($("received").value)||0);save();$("tip").textContent=money(tipAmount(current))}
function drawPayment(){$("cashBtn").classList.toggle("selected",db[current].payment==="Cash");$("cardBtn").classList.toggle("selected",db[current].payment==="Card");$("cardBox").classList.toggle("hidden",db[current].payment!=="Card");$("cardPaid").checked=!!db[current].cardPaid}
function drawCurrent(){drawHeaderOnly();drawPayment();$("tip").textContent=money(tipAmount(current));$("tableTotal").textContent=money(total(current));
$("statusButtons").innerHTML="";STAGES.forEach((s,n)=>{let b=document.createElement("button");b.className="status-btn "+(db[current].stage===n?"selected":"");b.innerHTML=s.short;b.onclick=()=>{db[current].stage=n;db[current].updated=stamp();save();drawCurrent()};$("statusButtons").appendChild(b)});
$("requestButtons").innerHTML="";REQUESTS.forEach(r=>{let b=document.createElement("button");b.className="request-btn "+(db[current].requests[r]?"selected":"");b.textContent=r;b.onclick=()=>{db[current].requests[r]=!db[current].requests[r];save();drawCurrent()};$("requestButtons").appendChild(b)});
$("menus").innerHTML="";ITEMS.filter(i=>i.type==="menu").forEach(i=>{let r=document.createElement("div");r.className="row";r.innerHTML=`<div><div class="name">${i.n}</div><div class="price">${money(i.p)}</div></div><div class="counter"><button class="minus" onclick="change('${i.k}',-1)">−</button><b>${db[current].q[i.k]}</b><button class="plus" onclick="change('${i.k}',1)">+</button></div>`;$("menus").appendChild(r)});
$("drinkTiles").innerHTML="";$("drinkDetails").innerHTML="";ITEMS.filter(i=>i.type==="drink").forEach(i=>{let p=pending(current,i.k),q=db[current].q[i.k]||0;let b=document.createElement("button");b.className="drinktile";b.innerHTML=`${p?`<span class="badgealert">${p}</span>`:""}<div class="ico">${i.ico}</div><div class="dn">${i.n}</div><div class="dp">${money(i.p)} · kliko +1</div>${q?`<div class="meta">${q} porositur</div>`:""}`;b.onclick=()=>change(i.k,1);$("drinkTiles").appendChild(b);if(q){let s=Math.min(db[current].served[i.k]||0,q);let d=document.createElement("div");d.className="drinkdetail";d.innerHTML=`<div class="drinkhead"><div class="name">${i.ico} ${i.n}</div><button class="minus" onclick="change('${i.k}',-1)">−1</button></div><div class="delivery"><div>Porositur<b>${q}</b></div><div>Dërguar<b>${s}</b></div><div class="${p?'redtxt':''}">Pret<b>${p}</b></div></div><div class="deliverBtns"><button class="delivered" ${p?`onclick="markOne('${i.k}')"`:"disabled"}>✓ Dërgova 1</button><button class="delivered" ${p?`onclick="markAll('${i.k}')"`:"disabled"}>✓ Të gjitha</button></div>`;$("drinkDetails").appendChild(d)}})}
function change(k,d){db[current].q[k]=Math.max(0,(db[current].q[k]||0)+d);if((db[current].served[k]||0)>db[current].q[k])db[current].served[k]=db[current].q[k];db[current].updated=stamp();save();drawCurrent()}
function markOne(k){db[current].served[k]=Math.min(db[current].q[k]||0,(db[current].served[k]||0)+1);save();drawCurrent()}
function markAll(k){db[current].served[k]=db[current].q[k]||0;save();drawCurrent()}
function nextStage(){if(db[current].stage<STAGES.length-1){db[current].stage++;save();drawCurrent()}}
function linesForTable(t){return ITEMS.filter(i=>(db[t].q[i.k]||0)>0).map(i=>({key:i.k,name:i.n,qty:db[t].q[i.k],price:i.p,subtotal:db[t].q[i.k]*i.p}))}
function shareText(txt){location.href="https://wa.me/?text="+encodeURIComponent(txt)}
function kitchenText(t){let b=db[t],n=people(t),x=`👨‍🍳 TASTE HOME — KUZHINA\n🪑 ${b.position}${b.name?" — "+b.name:""}\n👥 ${n} persona\n\nPËRGATIT ${n} ${STAGES[b.stage].msg}`;if(b.stage===3){let parts=[];["normal","veg","kids","group"].forEach(k=>{let i=ITEMS.find(z=>z.k===k),q=b.q[k]||0;if(q)parts.push(`${q} ${i.n}`)});if(parts.length)x+=`\n${parts.join("\n")}`}let req=Object.keys(b.requests||{}).filter(k=>b.requests[k]);if(req.length)x+=`\n\nKërkesa: ${req.join(", ")}`;let pend=ITEMS.filter(i=>i.type==="drink"&&pending(t,i.k)>0).map(i=>`${i.n}: ${pending(t,i.k)}`);if(pend.length)x+=`\n\n🥂 Për t'u çuar:\n${pend.join("\n")}`;if(b.notes)x+=`\n\nShënim: ${b.notes}`;return x}
function sendKitchenUpdate(){if(!people(current))return alert("Vendos personat ose menutë.");let x=kitchenText(current);db[current].requests={};db[current].updated=stamp();save();drawCurrent();shareText(x)}
function invoiceText(t){let b=db[t],x=`Taste Home\nData: ${isoDate()}\n${b.position}${b.name?" — "+b.name:""}\nPersona: ${people(t)}\nPagesa: ${b.payment}`;if(b.payment==="Card")x+=` — ${b.cardPaid?"PAGUAR":"PA PAGUAR"}`;x+="\n";linesForTable(t).forEach(a=>x+=`${a.name}: ${a.qty} × ${money(a.price)} = ${money(a.subtotal)}\n`);x+=`----------------\nTOTALI: ${money(total(t))}`;if(tipAmount(t))x+=`\nBakshish: ${money(tipAmount(t))}`;return x}
function shareCurrent(){if(total(current)<=0)return alert("Tavolina është bosh.");shareText(invoiceText(current))}
function printCurrent(){if(total(current)<=0)return alert("Tavolina është bosh.");$("printArea").innerHTML=`<div style="font-family:Arial;max-width:420px;margin:auto"><h2>Taste Home</h2>${invoiceText(current).replace(/\n/g,"<br>")}</div>`;window.print()}
function closeCurrent(){if(total(current)<=0)return alert("Tavolina është bosh.");let b=db[current];history.unshift({id:Date.now(),table:current,position:b.position,name:b.name,persons:people(current),notes:b.notes,payment:b.payment,cardPaid:b.cardPaid,cardNote:b.cardNote,date:isoDate(),closedAt:stamp(),lines:linesForTable(current),total:total(current),received:Number(b.received)||0,tip:tipAmount(current)});let pos=b.position;db[current]=blank(current);db[current].position=pos;save();alert("Tavolina u ruajt në histori.");showTables()}
function clearCurrent(){if(confirm("Ta fshij pa e ruajtur në histori?")){let pos=db[current].position;db[current]=blank(current);db[current].position=pos;save();showTables()}}
function drawKitchen(){$("kitchenList").innerHTML="";let n=0;for(let t=1;t<=tableCount;t++){if(!(total(t)>0||hasRequests(t)||pendingCount(t)))continue;n++;let c=document.createElement("div");c.className="card kitchen-card "+(pendingCount(t)?"waiting":"");c.innerHTML=`<h3>${db[t].position}${db[t].name?" — "+db[t].name:""}</h3><div><b>${STAGES[db[t].stage].msg} · 👥 ${people(t)}</b></div>${pendingCount(t)?`<div class="redtxt">🔴 ${pendingCount(t)} pije për t'u çuar</div>`:""}${db[t].notes?`<div class="meta">${db[t].notes}</div>`:""}`;$("kitchenList").appendChild(c)}if(!n)$("kitchenList").innerHTML='<div class="card empty">Nuk ka tavolina aktive.</div>'}
function filtered(){return history.filter(x=>x.date===$("historyDate").value)}
function drawHistory(){let day=filtered(),grand=day.reduce((s,x)=>s+x.total,0),tips=day.reduce((s,x)=>s+(x.tip||0),0),cash=day.filter(x=>x.payment==="Cash").reduce((s,x)=>s+x.total,0),card=day.filter(x=>x.payment==="Card").reduce((s,x)=>s+x.total,0),unpaid=day.filter(x=>x.payment==="Card"&&!x.cardPaid).reduce((s,x)=>s+x.total,0);$("dailyTotal").innerHTML=`Xhiro: ${money(grand)} · Bakshish: ${money(tips)}<br><span style="font-size:15px">Cash ${money(cash)} · Card ${money(card)} · Card pa paguar ${money(unpaid)}</span>`;$("historyBox").innerHTML=day.length?"":'<div class="empty">Nuk ka fatura.</div>';day.forEach(inv=>{let c=document.createElement("div");c.className="card";c.innerHTML=`<h3>${inv.position||""}${inv.name?" — "+inv.name:""} — ${money(inv.total)}</h3><div class="meta">${inv.closedAt}</div><div><span class="badge">👥 ${inv.persons||0}</span><span class="badge">${inv.payment||""}</span>${inv.payment==="Card"?`<span class="badge ${!inv.cardPaid?"redtxt":""}">${inv.cardPaid?"Paguar":"Pa paguar"}</span>`:""}<span class="badge">Tip ${money(inv.tip||0)}</span></div>${(inv.lines||[]).map(x=>`<div class="invoice-line"><span>${x.name} × ${x.qty}</span><b>${money(x.subtotal)}</b></div>`).join("")}<div class="actions"><button class="share" onclick="shareInvoice(${inv.id})">WhatsApp</button><button class="delete" onclick="deleteInvoice(${inv.id})">Fshij</button></div>`;$("historyBox").appendChild(c)})}
function shareInvoice(id){let inv=history.find(x=>x.id===id);if(!inv)return;let x=`Taste Home\n${inv.date}\n${inv.position||""} ${inv.name||""}\nPersona: ${inv.persons||0}\n`;inv.lines.forEach(a=>x+=`${a.name}: ${a.qty} × ${money(a.price)} = ${money(a.subtotal)}\n`);x+=`TOTALI: ${money(inv.total)}\nBakshish: ${money(inv.tip||0)}`;shareText(x)}
function deleteInvoice(id){if(confirm("Ta fshij faturën?")){history=history.filter(x=>x.id!==id);save();drawHistory()}}
function clearHistoryForDate(){let d=$("historyDate").value;if(confirm("T'i fshij të gjitha faturat e "+d+"?")){history=history.filter(x=>x.date!==d);save();drawHistory()}}
function shareDaily(){let day=filtered(),grand=day.reduce((s,x)=>s+x.total,0),tips=day.reduce((s,x)=>s+(x.tip||0),0);shareText(`Taste Home — ${$("historyDate").value}\nFatura: ${day.length}\nXhiro: ${money(grand)}\nBakshish: ${money(tips)}`)}
function qtyHistory(arr,i){return arr.reduce((s,inv)=>s+(inv.lines||[]).filter(x=>x.name===i.n||(i.k==="normal"&&x.name==="Menu")).reduce((a,x)=>a+(Number(x.qty)||0),0),0)}
function inferPeople(inv){return (inv.lines||[]).filter(x=>["Menu","Menu Normale","Menu Vegjet","Menu Kids","Grup"].includes(x.name)).reduce((s,x)=>s+(Number(x.qty)||0),0)}
let statsMode="year";
function setStatsMode(m){statsMode=m;$("statsAnnualBtn").classList.toggle("selected",m==="year");$("statsMonthlyBtn").classList.toggle("selected",m==="month");$("statsWeeklyBtn").classList.toggle("selected",m==="week");$("statsYearBox").classList.toggle("hidden",m!=="year");$("statsMonthBox").classList.toggle("hidden",m!=="month");$("statsWeekBox").classList.toggle("hidden",m!=="week");drawStats()}
function fillYears(){let ys=[...new Set(history.map(x=>(x.date||"").slice(0,4)).filter(Boolean))].sort().reverse(),now=String(new Date().getFullYear());if(!ys.includes(now))ys.unshift(now);$("statsYear").innerHTML=ys.map(y=>`<option>${y}</option>`).join("");$("statsYear").value=now;let td=new Date();$("statsMonth").value=td.toISOString().slice(0,7);let d=new Date(Date.UTC(td.getFullYear(),td.getMonth(),td.getDate())),dn=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dn);let y0=new Date(Date.UTC(d.getUTCFullYear(),0,1)),wn=Math.ceil((((d-y0)/86400000)+1)/7);$("statsWeek").value=`${d.getUTCFullYear()}-W${String(wn).padStart(2,"0")}`}
function weekRange(v){if(!v)return null;let [y,w]=v.split("-W").map(Number),j=new Date(y,0,4),jd=j.getDay()||7,mon=new Date(y,0,4-(jd-1)+(w-1)*7);mon.setHours(0,0,0,0);let sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);return[mon,sun]}
function statsFiltered(){if(statsMode==="month"){let m=$("statsMonth").value;return history.filter(x=>(x.date||"").startsWith(m))}if(statsMode==="week"){let r=weekRange($("statsWeek").value);return r?history.filter(x=>{let d=new Date((x.date||"")+"T12:00:00");return d>=r[0]&&d<=r[1]}):[]}return history.filter(x=>(x.date||"").startsWith($("statsYear").value))}
function chart(el,vals,kind,labels){let max=Math.max(...vals,1);$(el).innerHTML=vals.map((v,i)=>`<div class="barwrap"><div class="barval">${kind==="money"?"€"+Math.round(v):v}</div><div class="bar" style="height:${Math.max(2,(v/max)*145)}px"></div><div>${labels[i]||""}</div></div>`).join("")}
function drawStats(){let arr=statsFiltered(),persons=arr.reduce((s,x)=>s+(Number(x.persons)||inferPeople(x)),0),revenue=arr.reduce((s,x)=>s+(Number(x.total)||0),0),tips=arr.reduce((s,x)=>s+(Number(x.tip)||0),0);$("statsPeriodLabel").textContent=`${arr.length} fatura`;$("statsCards").innerHTML=[["👥 Persona",persons],["🍽️ Normale",qtyHistory(arr,ITEMS[0])],["🥬 Vegjet",qtyHistory(arr,ITEMS[1])],["🧒 Kids",qtyHistory(arr,ITEMS[2])],["👥 Grup",qtyHistory(arr,ITEMS[3])],["💰 Xhiro",money(revenue)],["💶 Bakshish",money(tips)],["Mes./person",persons?money(revenue/persons):money(0)]].map(a=>`<div class="stat"><span>${a[0]}</span><b>${a[1]}</b></div>`).join("");
let pv=[],rv=[],tv=[],labels=[];if(statsMode==="year"){pv=Array(12).fill(0);rv=Array(12).fill(0);tv=Array(12).fill(0);labels=["J","S","M","P","M","Q","K","G","S","T","N","D"];arr.forEach(x=>{let m=Number((x.date||"").slice(5,7))-1;if(m>=0){pv[m]+=Number(x.persons)||inferPeople(x);rv[m]+=Number(x.total)||0;tv[m]+=Number(x.tip)||0}})}else if(statsMode==="month"){let [y,m]=($("statsMonth").value||"0-0").split("-").map(Number),days=new Date(y,m,0).getDate();pv=Array(days).fill(0);rv=Array(days).fill(0);tv=Array(days).fill(0);labels=Array.from({length:days},(_,i)=>String(i+1));arr.forEach(x=>{let d=Number((x.date||"").slice(8,10))-1;if(d>=0){pv[d]+=Number(x.persons)||inferPeople(x);rv[d]+=Number(x.total)||0;tv[d]+=Number(x.tip)||0}})}else{pv=Array(7).fill(0);rv=Array(7).fill(0);tv=Array(7).fill(0);labels=["H","M","M","E","P","S","D"];let r=weekRange($("statsWeek").value);if(r)arr.forEach(x=>{let d=new Date((x.date||"")+"T12:00:00"),idx=Math.floor((d-r[0])/86400000);if(idx>=0&&idx<7){pv[idx]+=Number(x.persons)||inferPeople(x);rv[idx]+=Number(x.total)||0;tv[idx]+=Number(x.tip)||0}})}chart("peopleChart",pv,"num",labels);chart("revenueChart",rv,"money",labels);chart("tipsChart",tv,"money",labels)}
save();drawTables();
</script>
</body></html>
